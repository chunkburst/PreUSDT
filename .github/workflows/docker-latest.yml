name: docker-latest
on:
  workflow_dispatch:
  create:
    tags:
      - v*
env:
  APP_NAME: preusdt
  IMAGE_NAME: preusdt
  DOCKERHUB_REPO: chunkburst/preusdt
permissions:
  contents: read
  packages: write
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Generate Docker metadata
        id: meta
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_BETA_TOKEN: ${{ secrets.DOCKER_HUB_BETA_TOKEN }}
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            BASE_VERSION="$(git describe --tags --abbrev=0)"
          else
            BASE_VERSION="snapshot"
          fi
          VERSION_TAG="${BASE_VERSION}-${SHORT_SHA}"
          GHCR_OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          GHCR_REPO="ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}"
          DOCKERHUB_PASSWORD="${DOCKERHUB_TOKEN:-$DOCKERHUB_BETA_TOKEN}"
          HAS_DOCKERHUB="false"
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_PASSWORD}" ]]; then
            HAS_DOCKERHUB="true"
          fi
          {
            echo "app_version=${SHORT_SHA}"
            echo "version_tag=${VERSION_TAG}"
            echo "has_dockerhub=${HAS_DOCKERHUB}"
            echo "tags<<EOF"
            echo "${GHCR_REPO}:latest"
            echo "${GHCR_REPO}:${SHORT_SHA}"
            echo "${GHCR_REPO}:${VERSION_TAG}"
            if [[ "${HAS_DOCKERHUB}" == "true" ]]; then
              echo "${DOCKERHUB_REPO}:latest"
              echo "${DOCKERHUB_REPO}:${SHORT_SHA}"
              echo "${DOCKERHUB_REPO}:${VERSION_TAG}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to DockerHub
        if: steps.meta.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_HUB_BETA_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version_tag }}
          tags: ${{ steps.meta.outputs.tags }}
